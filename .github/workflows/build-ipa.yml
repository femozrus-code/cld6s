name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Polyfills dependency
        run: |
          rm -rf Polyfills
          git clone --depth 1 https://github.com/PoomSmart/Polyfills.git Polyfills

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build IPA
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeLegacy-ipa
          path: build/output/ClaudeLegacy.ipa
          if-no-files-found: error
